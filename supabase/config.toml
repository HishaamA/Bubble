project_id = "simerfamily"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "capacitor://localhost/**",
  "http://localhost/**",
]

# Native Clerk third-party auth. This public issuer domain comes from the
# project's Clerk publishable key; no Clerk or Supabase secret is stored here.
[auth.third_party.clerk]
enabled = true
domain = "well-guppy-1961.clerk.accounts.dev"

[storage]
enabled = true
# Match the hosted project's default. Feature migrations enforce their own
# lower per-object limits before finalization.
file_size_limit = "50MiB"

[functions.flight-status]
# Clerk issues a third-party RS256 token, so the legacy Edge gateway check is
# disabled. The handler still rejects requests unless that token authenticates
# through PostgREST and resolves to an approved family membership.
verify_jwt = false
