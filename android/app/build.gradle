apply plugin: 'com.android.application'

def testAuthBypassRequested = project
    .findProperty('enableTestAuthBypass')
    ?.toString()
    ?.toBoolean() ?: false

android {
    namespace = "com.simerfamily.kinsphere"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion "27.0.12077973"
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.simerfamily.kinsphere"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments "-DOpenCV_DIR=${rootProject.projectDir.parentFile}/.native-deps/opencv-4.12.0/OpenCV-android-sdk/sdk/native/jni", "-DANDROID_STL=c++_shared"
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/stitch/CMakeLists.txt') }
    }
    packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
    androidResources {
        // Keep dotfiles out while allowing modern web assets copied by Capacitor.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress += ['onnx']
    }
    buildTypes {
        debug {
            // This can only enable test access in a debuggable APK. Release
            // hard-codes the field to false regardless of Gradle properties.
            buildConfigField "boolean", "ENABLE_TEST_AUTH_BYPASS", testAuthBypassRequested ? "true" : "false"
        }
        release {
            buildConfigField "boolean", "ENABLE_TEST_AUTH_BYPASS", "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/cardboard-sdk-1.34.0.aar')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.ar:core:1.54.0"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.23.2"
    // The pinned Cardboard AAR is local, so its runtime dependencies must be
    // declared here rather than resolved from Maven metadata.
    implementation "com.google.android.gms:play-services-vision:20.1.3"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.protobuf:protobuf-javalite:3.19.4"
    implementation "org.jspecify:jspecify:1.0.0"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

def googleServicesFile = file('google-services.json')
if (googleServicesFile.isFile() && googleServicesFile.length() > 0L) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
